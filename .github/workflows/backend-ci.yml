name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Create test environment file
        run: |
          cat > .env <<'EOF'
          STRIPE_SECRET_KEY=sk_test_ci_placeholder
          STRIPE_PRICE_PRO_ID=price_ci_pro
          STRIPE_PRICE_ENTERPRISE_ID=price_ci_enterprise
          STRIPE_CHECKOUT_SUCCESS_URL=http://localhost:5173/checkout/success
          EOF

      - name: Build and test
        working-directory: backend
        run: ./mvnw -B clean verify