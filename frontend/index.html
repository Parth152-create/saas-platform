<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexa — Workforce &amp; Operations</title>
    <meta name="description" content="Manage your workforce, projects, time, workflows and business operations from one secure workspace." />
    <meta name="application-name" content="Nexa" />
    <meta name="apple-mobile-web-app-title" content="Nexa" />
    <script>
      (function() {
        try {
          const pref = localStorage.getItem('saas_theme_preference');
          const isDark = pref === 'dark' || (!pref && window.matchMedia('(prefers-color-scheme: dark)').matches) || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
