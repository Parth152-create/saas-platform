<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <style>
    :root {
      --bg: #0A0A0A;
      --stem: #FFFFFF;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #FFFFFF;
        --stem: #0A0A0A;
      }
    }
    .bg-box { fill: var(--bg); }
    .stem-path { fill: var(--stem); }
    .connector-path { fill: #2563EB; }
  </style>
  <!-- High Contrast Container -->
  <rect width="32" height="32" rx="7" class="bg-box" />

  <!-- Geometric N Mark Scaled Inside 32x32 Favicon -->
  <g transform="translate(1.5, 1.5) scale(0.90625)">
    <!-- Left Pillar -->
    <path
      d="M5 12.5A1.5 1.5 0 0 1 6.5 11H8.25L17.1 28H6.5A1.5 1.5 0 0 1 5 26.5V12.5Z"
      class="stem-path"
    />
    <!-- Electric Blue Diagonal Workflow Connector -->
    <path
      d="M8.2 4H12.5L23.8 28H19.5L8.2 4Z"
      class="connector-path"
    />
    <!-- Right Pillar -->
    <path
      d="M27 19.5A1.5 1.5 0 0 1 25.5 21H23.75L14.9 4H25.5A1.5 1.5 0 0 1 27 5.5V19.5Z"
