spring:
  application:
    name: backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5434/saas_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:saas}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:saas_dev_pw}}
    hikari:
      pool-name: NexaHikariPool
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}
      connection-test-query: SELECT 1
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:${REDIS_HOST:localhost}}
      port: ${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6380}}
  flyway:
    locations: classpath:db/migration/global

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics"
  endpoint:
    health:
      show-details: ${MANAGEMENT_HEALTH_SHOW_DETAILS:when-authorized}
      probes:
        enabled: true

app:
  google:
    client-id: ${GOOGLE_CLIENT_ID:906646436149-dkke9514rgicekhqsglpavm8e5iffgug.apps.googleusercontent.com}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

  websocket:
    allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:}

  jwt:
    public-key: ${JWT_PUBLIC_KEY:classpath:certs/jwt-public.pem}
    private-key: ${JWT_PRIVATE_KEY:classpath:certs/jwt-private.pem}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:7d}

  email:
    enabled: ${EMAIL_ENABLED:true}
    provider: ${EMAIL_PROVIDER:log}
    from-address: ${EMAIL_FROM_ADDRESS:noreply@nexa.app}
    from-name: ${EMAIL_FROM_NAME:Nexa Platform}
    smtp:
      host: ${SMTP_HOST:localhost}
      port: ${SMTP_PORT:587}
      username: ${SMTP_USERNAME:}
      password: ${SMTP_PASSWORD:}
      auth: ${SMTP_AUTH:false}
      starttls: ${SMTP_STARTTLS:false}

  storage:
    provider: ${STORAGE_PROVIDER:memory}
    base-path: ${STORAGE_BASE_PATH:/tmp/nexa-storage}
    max-file-size-bytes: ${STORAGE_MAX_FILE_SIZE_BYTES:10485760}

  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    auth-requests-per-minute: ${RATE_LIMIT_AUTH_PER_MIN:60}
    api-requests-per-minute: ${RATE_LIMIT_API_PER_MIN:300}

  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    checkout-success-url: ${STRIPE_CHECKOUT_SUCCESS_URL:http://localhost:5173/billing/success?session_id={CHECKOUT_SESSION_ID}}
    checkout-cancel-url: ${STRIPE_CHECKOUT_CANCEL_URL:http://localhost:5173/billing/cancel}
    portal-return-url: ${STRIPE_PORTAL_RETURN_URL:http://localhost:5173/billing}
    price-tiers:
      pro-price-id: ${STRIPE_PRICE_PRO_ID:}
      enterprise-price-id: ${STRIPE_PRICE_ENTERPRISE_ID:}

server:
  port: ${PORT_BACKEND:8090}
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false
