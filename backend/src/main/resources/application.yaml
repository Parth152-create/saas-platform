spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://localhost:5434/saas_db
    username: saas
    password: saas_dev_pw
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6380
  flyway:
    locations: classpath:db/migration/global

app:
  google:
    client-id:  906646436149-dkke9514rgicekhqsglpavm8e5iffgug.apps.googleusercontent.com
  jwt:
    public-key: classpath:certs/jwt-public.pem
    private-key: classpath:certs/jwt-private.pem
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    checkout-success-url: "http://localhost:5173/billing/success?session_id={CHECKOUT_SESSION_ID}"
    checkout-cancel-url: "http://localhost:5173/billing/cancel"
    portal-return-url: ${STRIPE_PORTAL_RETURN_URL:http://localhost:5173/billing}
    price-tiers:
      price_replace_with_your_pro_price_id: PRO
      price_replace_with_your_enterprise_price_id: ENTERPRISE

server:
  port: 8090

stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  checkout-success-url: "http://localhost:5173/billing/success?session_id={CHECKOUT_SESSION_ID}"
